name: Android build and test
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npm run android:prepare
      - name: Download Spotify App Remote SDK
        run: |
          mkdir -p android/app/libs
          curl --fail --location --retry 3 --output android/app/libs/spotify-app-remote-release-0.8.0.aar https://github.com/spotify/android-sdk/releases/download/v0.8.0-appremote_v2.1.0-auth/spotify-app-remote-release-0.8.0.aar
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: Vaigarai-Paani-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
